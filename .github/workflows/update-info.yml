name: Publish Update Information

on:
  workflow_run:
    workflows: [Build Test APK, Build Test Packages, Build]
    types: [completed]
  push:
    branches: [master, main]
    paths: [scripts/update-release-manifest.js, .github/workflows/update-info.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-update-information
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate public release information
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-release-manifest.js /tmp/update-info/mobile.json
      - name: Publish metadata only
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs')
            const { owner, repo } = context.repo
            const branch = 'release-info'
            const path = 'mobile.json'
            const raw = fs.readFileSync('/tmp/update-info/mobile.json', 'utf8')
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch })
            } catch (error) {
              if (error.status !== 404) throw error
              const tree = await github.rest.git.createTree({ owner, repo, tree: [{ path, mode: '100644', type: 'blob', content: raw }] })
              const commit = await github.rest.git.createCommit({ owner, repo, message: 'build: initialize public update information', tree: tree.data.sha, parents: [] })
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/' + branch, sha: commit.data.sha })
              return
            }
            let existing
            try {
              existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch })
            } catch (error) {
              if (error.status !== 404) throw error
            }
            const content = Buffer.from(raw).toString('base64')
            if (existing && existing.data.content.replace(/\s/g, '') === content) return
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, branch, path, content, sha: existing?.data.sha, message: 'build: refresh public update information' })
      - name: Refresh CDN metadata cache
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const path = '/gh/' + context.repo.owner + '/' + context.repo.repo + '@release-info/mobile.json'
            const response = await fetch('https://purge.jsdelivr.net' + path, { signal: AbortSignal.timeout(30000) })
            if (!response.ok) throw new Error('CDN refresh HTTP ' + response.status)
            const result = await response.json()
            const entry = result.paths?.[path]
            if (result.status !== 'finished' || !entry || entry.throttled || Object.values(entry.providers || {}).some(ok => !ok)) {
              throw new Error('CDN refresh incomplete; the raw GitHub manifest remains available')
            }
            core.info('CDN refresh accepted; edge propagation can take additional time')
